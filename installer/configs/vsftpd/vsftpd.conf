listen=YES
anonymous_enable=NO
local_enable=YES
write_enable=YES
# Group-readable uploads: panel FTP logins share the home dir's group (see
# ftp-add.sh), so 007 (660 files / 770 dirs) keeps uploads readable+writable
# for the owner and sibling logins while shut to everyone else. Owner-only
# 077 would orphan uploads from the pool user and the file manager.
local_umask=007
chroot_local_user=YES
allow_writeable_chroot=YES
# NOTE: no 'passive_mode' directive exists — pasv_enable defaults to YES
pasv_min_port=40000
pasv_max_port=50000
xferlog_enable=YES
# fail2ban vsftpd jail polls this file (Ubuntu stock default path, kept so the
# template stays familiar): without it nothing creates it and polling mode
# refuses to start fail2ban at all. dual_log puts failed logins here too,
# which is what the jail actually counts.
xferlog_file=/var/log/vsftpd.log
dual_log_enable=YES
connect_from_port_20=YES
pam_service_name=vsftpd
# panel FTP users get /bin/false shells — do not require a valid login shell
check_shell=NO
userlist_enable=YES
userlist_file=/etc/vsftpd.userlist
userlist_deny=NO
ssl_enable=NO
# FTPS is enabled by scripts/ssl-selfsigned.sh (set-or-replace, NOT append:
# this NO line already matches ^ssl_enable=) once a cert exists in
# /etc/ssl/skypanel/. Never run plaintext + force_* together.
# LXC/OpenVZ containers: seccomp sandbox syscalls are blocked — must be off
seccomp_sandbox=NO
background=NO
