# OpenLiteSpeed KarnakPanel vhost — docroot = panel public/, runtime set by php-multiphp.sh / panel-php-patch.sh (4 handler tokens below)
# Native OLS style: $DOC_ROOT location, allowBrowse 1 (verified against stock Example vhost).
# Do NOT add 'type NULL' or 'passive'-style invented directives; do NOT set restrained 1
# when docRoot lives outside vhRoot (OLS denies the context).
docRoot                   /usr/local/skypanel/panel/public/
vhDomain                  *
vhAliases                 *
adminEmails               admin@localhost
enableGzip                1

errorlog /var/log/karnakpanel/error.log {
  useServer               0
  logLevel                WARN
  rollingSize             10M
}

accesslog /var/log/karnakpanel/access.log {
  useServer               0
  logFormat               '%h %l %u %t "%r" %>s %b'
  rollingSize             10M
}

index  {
  useServer               0
  indexFiles              index.php, index.html
}

context / {
  location                $DOC_ROOT/
  allowBrowse             1
  indexFiles              index.php, index.html
  rewrite  {
    enable                1
    rules                 <<<END_rules
RewriteCond %{REQUEST_FILENAME} !-f
RewriteCond %{REQUEST_FILENAME} !-d
RewriteRule ^(.*)$ index.php [L]
END_rules
  }
}

scripthandler  {
  add                     lsapi:lsphp85 php
}

extprocessor lsphp85 {
  type                    lsapi
  address                 uds://tmp/lshttpd/lsphp85.sock
  maxConns                20
  env                     PHP_LSAPI_CHILDREN=20
  initTimeout             60
  retryTimeout            0
  persistConn             1
  pcKeepAliveTimeout      1
  respBuffer              0
  autoStart               1
  path                    /usr/local/lsws/lsphp85/bin/lsphp
  backlog                 100
  instances               1
  priority                0
  memSoftLimit            2047M
  memHardLimit            2047M
  procSoftLimit           400
  procHardLimit           500
}
# Per-domain PHP override: php-switch.sh points the handler at another LSPHP version.
