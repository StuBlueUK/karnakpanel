# KarnakPanel fail2ban filter for the panel itself (:8090). Matches the
# login-failure lines Helpers::log() writes to panel.log, e.g.:
# 2026-10-07T20:28:58+00:00 failed login for 'admin' from 192.168.0.20
# 2026-10-07T20:28:58+00:00 login throttled for 192.168.0.20 (8 recent failures)
[Definition]
failregex = ^.* failed login for .* from <HOST>$
            ^.* login throttled for <HOST>\s.*$
ignoreregex =
