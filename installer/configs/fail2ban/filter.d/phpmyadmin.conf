# KarnakPanel fail2ban filter for phpMyAdmin gate brute force (HTTP 401s), e.g.:
# '192.168.0.20 - - [05/Oct/2026:08:00:00 +0000] "GET / HTTP/1.1" 401 800'
# QUIRKS (verified): a literal quote directly before <HOST> never matches, and
# \] inside [^...] breaks matching — so the timestamp is matched with \S+.
[Definition]
failregex = <HOST> \S+ \S+ \S+ "[^"]*" 401 \d+
ignoreregex =
