# KarnakPanel web-login flood: POST storms on wp-login.php / xmlrpc.php in the
# per-domain OLS access logs. Lines start with a stray single quote (logFormat
# artifact) — the ^'? tolerates it. NOTE: fail2ban 1.0.x misses GREEDY
# quantifiers inside [...] here, so the timestamp gap uses lazy .*? (verified).
# Legit logins never hit maxretry in findtime.
[Definition]
failregex = ^'?<HOST> \S+ \S+ \[.*?\] "POST /(wp-login\.php|xmlrpc\.php)[^"]*"
ignoreregex =
