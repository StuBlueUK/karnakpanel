# KarnakPanel Dovecot — virtual mailboxes (panel DB); no unix-account logins
# Logins are SQL only (full address); userdb passwd stays for box-local ~/Maildir.
# password hashes are panel bcrypt -> BLF-CRYPT scheme (Dovecot reads $2y$).
# NOTE: single-line blocks are NOT valid Dovecot syntax — keep everything multi-line.
# Quota is enforced at BOTH layers from email_accounts.quota_mb: Dovecot here
# (IMAP APPEND/COPY + GETQUOTA) and Exim virtual_delivery (SMTP-time bounce).
# Log to our own file (not just syslog): the fail2ban dovecot jail polls this
# path — syslog-only would leave it blind like the other file jails were.
# Single file on purpose: a split info_log_path would divert auth failures
# away from the path fail2ban watches.
log_path = /var/log/dovecot.log
mail_plugins = $mail_plugins quota
plugin {
  quota = maildir:User quota
  # personal sieve scripts for filtered mailboxes (managed by
  # email-filters-sync.sh; only LMTP deliveries consult them)
  sieve = /var/lib/skypanel/sieve/%d/%n.sieve
}
protocol imap {
  mail_plugins = $mail_plugins imap_quota
}
protocol lmtp {
  mail_plugins = $mail_plugins sieve
}
# Plaintext logins only from loopback (Roundcube) — outsiders must use 993/TLS.
disable_plaintext_auth = yes
login_trusted_networks = 127.0.0.1 ::1
mail_location = maildir:~/Maildir
auth_mechanisms = plain login
# IMAP is the default (and only) mailbox protocol — POP3 deletes mail off the
# server by default in most clients and causes "missing mail" confusion.
# LMTP is delivery-only (Exim hands filtered mail here for sieve); no login.
protocols = imap lmtp
# TLS everywhere (cert paths rewritten by ssl-selfsigned.sh / ssl-issue.sh).
# 143 STARTTLS + 993 implicit TLS. Plaintext IMAP still answers on 143 for
# LAN-only setups but login is refused unless TLS (disable_plaintext_auth).
ssl = yes
ssl_cert = </etc/ssl/skypanel/cert.pem
ssl_key = </etc/ssl/skypanel/key.pem
ssl_min_protocol = TLSv1.2
# our conf replaces the stock one, so its 10-ssl.conf ssl_dh never applies
ssl_dh = </usr/share/dovecot/dh.pem
# Per-domain mail TLS (mail-sni.sh writes skypanel-sni.conf with local_name
# blocks; absent file = box cert for everyone, so fresh installs are safe).
!include_try /etc/dovecot/skypanel-sni.conf
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}
userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}
userdb {
  driver = passwd
}

# Exim SASL socket (Debian exim runs as Debian-exim)
service auth {
  unix_listener auth-client {
    mode = 0660
    user = Debian-exim
    group = mail
  }
}
# Exim hands sieve-filtered mail to LMTP here (see virtual_lmtp_filter router)
service lmtp {
  unix_listener lmtp {
    mode = 0660
    user = Debian-exim
    group = mail
  }
}
