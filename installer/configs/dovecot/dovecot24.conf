# KarnakPanel Dovecot 2.4 (Debian 13+) — same behaviour as dovecot.conf (2.3),
# 2.4 syntax. The installer picks this file when `dovecot --version` is 2.4+.
# Virtual mailboxes (panel DB) first, system users (PAM) as fallback.
# Password hashes are panel bcrypt -> BLF-CRYPT (Dovecot reads $2y$).
# NOTE: single-line blocks are NOT valid Dovecot syntax — keep everything multi-line.
# Quota is enforced at BOTH layers from email_accounts.quota_mb: Dovecot here
# (IMAP APPEND/COPY + GETQUOTA) and Exim virtual_delivery (SMTP-time bounce).
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0
# Log to our own file (not just syslog): the fail2ban dovecot jail polls this
# path. Single file on purpose: a split info_log_path would divert auth
# failures away from the path fail2ban watches.
log_path = /var/log/dovecot.log
# IMAP is the only mailbox protocol (POP3 deletes mail off the server by
# default in most clients). LMTP is delivery-only (Exim hands filtered mail
# here for sieve); no login.
protocols {
  imap = yes
  lmtp = yes
}
# Plaintext logins only from loopback (Roundcube) — outsiders must use 993/TLS.
auth_allow_cleartext = no
login_trusted_networks = 127.0.0.1 ::1
auth_mechanisms = plain login
# system users: ~/Maildir; virtual users get mail_path/home from userdb sql.
mail_driver = maildir
mail_path = ~/Maildir
# 2.3 had an implicit inbox namespace; 2.4 needs it declared. Separator left
# at the storage default ('.' for maildir), as on 2.3 boxes.
namespace inbox {
  inbox = yes
}
mail_plugins {
  quota = yes
}
# maildir++ quota (maildirsize), as on 2.3; the limit comes per user from
# userdb sql (quota_storage_size).
quota "User quota" {
  driver = maildir
}
protocol imap {
  mail_plugins {
    imap_quota = yes
  }
}
protocol lmtp {
  mail_plugins {
    sieve = yes
  }
}
# personal sieve script for filtered mailboxes (managed by
# email-filters-sync.sh; only LMTP deliveries consult it)
sieve_script personal {
  driver = file
  path = /var/lib/skypanel/sieve/%{user | domain}/%{user | username}.sieve
}
# TLS everywhere: 143 STARTTLS + 993 implicit TLS. Plaintext IMAP still
# answers on 143 but login is refused unless TLS (auth_allow_cleartext).
ssl = yes
ssl_server_cert_file = /etc/ssl/skypanel/cert.pem
ssl_server_key_file = /etc/ssl/skypanel/key.pem
ssl_min_protocol = TLSv1.2
# Per-domain mail TLS (mail-sni.sh writes skypanel-sni.conf with local_name
# blocks; absent file = box cert for everyone, so fresh installs are safe).
!include_try /etc/dovecot/skypanel-sni.conf
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

# SQL connection + queries (holds the DB password: root:dovecot 640)
!include /etc/dovecot/dovecot-sql.conf.ext
# no PAM passdb: unix accounts (hosting accounts, root) must not log in to
# IMAP or, via Exim's dovecot authenticator, SMTP AUTH
userdb passwd {
}

# Exim SASL socket (Debian exim runs as Debian-exim)
service auth {
  unix_listener auth-client {
    mode = 0660
    user = Debian-exim
    group = mail
  }
}
# Exim hands sieve-filtered mail to LMTP here (see virtual_lmtp_filter router)
service lmtp {
  unix_listener lmtp {
    mode = 0660
    user = Debian-exim
    group = mail
  }
}
