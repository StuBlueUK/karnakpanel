# KarnakPanel Exim4 — smarthost-free internet site, Maildir delivery, spamd scanning
# Managed by installer. Layout in /etc/exim4/virtual (created by installer/scripts):
#   domains          — "customerdomain.com: ok" per hosted domain (local_domains lookup)
#   aliases          — "box@domain: systemuser" lines. Single file, because Exim
#                      taint-checks reject envelope-derived file paths (no per-domain files).
# Key transports: local_delivery -> $home/Maildir
# NOTE: __MAILNAME__ is substituted at install time (mail.<panel-domain> or the
# box hostname). A localhost HELO breaks reverse-DNS checks and "server behind
# hostname" validators on every outbound message.
primary_hostname = __MAILNAME__
# port 587: message submission (AUTH required by RCPT policy); 465 implicit TLS
daemon_smtp_ports = 25 : 587 : 465
tls_on_connect_ports = 465
# TLS (cert paths rewritten by ssl-selfsigned.sh / ssl-issue.sh to real files).
# Per-domain SNI (mail-sni.sh): the SNI name looks up allowlist maps, so
# the tainted $tls_sni can never become a path (direct use would fail Exim's
# taint check); lookup RESULTS are trusted. Unknown/absent SNI or missing
# map files -> box cert. Two maps (cert+key) because Exim string-fu for a
# suffix swap needs regex $ anchors that don't survive config expansion.
tls_certificate = ${if exists{/etc/exim4/virtual/mailcerts}{${lookup{$tls_sni}lsearch{/etc/exim4/virtual/mailcerts}{$value}{/etc/ssl/skypanel/cert.pem}}}{/etc/ssl/skypanel/cert.pem}}
tls_privatekey = ${if exists{/etc/exim4/virtual/mailkeys}{${lookup{$tls_sni}lsearch{/etc/exim4/virtual/mailkeys}{$value}{/etc/ssl/skypanel/key.pem}}}{/etc/ssl/skypanel/key.pem}}
tls_advertise_hosts = *
# AUTH only over TLS or loopback (webmail/cron) — never plaintext from outside.
# NOTE: list separator switched to ';' — a bare ::1 would split on Exim's
# default ':' separator and never match (Roundcube connects over IPv6 loopback).
auth_advertise_hosts = <; 127.0.0.1 ; ::1 ; ${if def:tls_in_cipher{*}}
# MySQL for quota lookups (rendered by installer: __DOVECOT_DBPASS__ substituted;
# reuses the dovecot SELECT-only user — no new credentials to manage)
hide mysql_servers = localhost/skypanel/dovecot/__DOVECOT_DBPASS__
# ClamAV socket for the malware ACL (clamav-daemon package path). Absent
# socket + defer_ok below = fail open, so boxes without ClamAV keep delivering.
av_scanner = clamd:/var/run/clamav/clamd.ctl
domainlist local_domains = @ : localhost : lsearch;/etc/exim4/virtual/domains
acl_smtp_rcpt = acl_check_rcpt
acl_smtp_data = acl_check_data
acl_not_smtp = acl_check_not_smtp
begin acls
# Minimal inbound policy: local domains + authenticated relay, no open relay.
acl_check_rcpt:
  # list posts cost against the LIST's own hourly bucket (fanout multiplier:
  # one post emits per member, so the sender's personal cap can't see it).
  # Members-only still enforced by the routers; this only adds the rate cap.
  deny domains = +local_domains
    condition = ${lookup{$local_part@$domain}lsearch{/etc/exim4/virtual/lists}{yes}{no}}
    condition = ${lookup{$sender_address}lsearch{${lookup{$local_part@$domain}lsearch{/etc/exim4/virtual/lists}{$value}fail}}{yes}{no}}
    ratelimit = ${lookup mysql{SELECT COALESCE((SELECT CAST(s.value AS UNSIGNED) FROM settings s WHERE s.name='list_posts_default'), 10)}{$value}{10}} / 1h / $local_part@$domain
    message = list post rate exceeded — retry later
  accept hosts = :
  # outbound rate caps (compromised-script brake). FIRST so nothing below can
  # accept around them: per-mailbox override, else the smtp_default setting,
  # else 200/hr. Local sendmail injection (PHP mail(), cron) never reaches
  # this ACL — it is capped separately in acl_check_not_smtp below.
  deny authenticated = *
    ratelimit = ${lookup mysql{SELECT COALESCE((SELECT e.smtp_limit FROM email_accounts e JOIN domains d ON d.id=e.domain_id WHERE CONCAT(e.localpart,'@',d.domain)='${quote_mysql:$authenticated_id}'), (SELECT CAST(s.value AS UNSIGNED) FROM settings s WHERE s.name='smtp_default'), 200)}{$value}{200}} / 1h / $authenticated_id
    message = sending rate exceeded (hourly cap) — retry later or ask your admin
  # KarnakPanel mail-guard hold (managed — do not hand-edit)
  # compromised-mailbox hold (cli/mail-guard.php sets it, Email page clears
  # it on password reset or admin release): a held mailbox sends nothing.
  deny authenticated = *
    condition = ${lookup mysql{SELECT 1 FROM email_accounts e JOIN domains d ON d.id=e.domain_id WHERE CONCAT(e.localpart,'@',d.domain)='${quote_mysql:$authenticated_id}' AND e.send_hold_at IS NOT NULL}{yes}{no}}
    message = sending suspended for this mailbox (suspected compromise) — reset its password in the panel
    log_message = mail-guard hold: $authenticated_id
  # KarnakPanel rcpt verify (managed — do not hand-edit)
  # unknown hosted recipients refused at RCPT: accept-then-bounce mailed NDRs
  # to forged senders (backscatter -> blocklists). The routers in verify mode
  # are the existence check, so mailboxes/plus/forwarders/lists/catch-alls/
  # reports/remote-handled domains stay exact; DNS trouble -> 4xx, never 5xx.
  # log_message deliberately puts our own text right after the address: the
  # fail2ban exim filter bans on "rejected RCPT <a>: Unrouteable address"
  # (Exim still appends the verify detail after ours — that line is not
  # matched), and big senders hitting a stale address must never get banned.
  # Emergency off: touch /etc/exim4/virtual/rcpt_verify_off (no reload).
  deny domains = +local_domains
    condition = ${if exists{/etc/exim4/virtual/rcpt_verify_off}{no}{yes}}
    !verify = recipient
    message = ${if def:acl_verify_message{$acl_verify_message}{no such recipient}}
    log_message = hosted recipient refused (verify: $acl_verify_message)
  accept domains = +local_domains
  accept authenticated = *
  deny message = relay denied
acl_check_not_smtp:
  # same brake for locally injected mail (PHP mail() is the classic
  # hacked-WordPress path): unattributable to a mailbox, so capped per sender
  # domain at the global default. Null senders (bounces, vacation replies)
  # are exempt.
  deny condition = ${if !eq{$sender_address}{}}
    ratelimit = ${lookup mysql{SELECT COALESCE((SELECT CAST(s.value AS UNSIGNED) FROM settings s WHERE s.name='smtp_default'), 200)}{$value}{200}} / 1h / $sender_address_domain
    message = sending rate exceeded (hourly cap) — retry later or ask your admin
  accept
  deny message = relay denied
acl_check_data:
  # malware first (cheap reject before spam processing). defer_ok = fail OPEN
  # when clamd is absent/down (e.g. ClamAV not installed) — never lose mail.
  deny malware = */defer_ok
       message = Rejected: malware detected ($malware_name)
  # weekend scan-skip (panel Email -> "Skip spam scanning Sat/Sun"): spamd
  # costs CPU per message and nobody triages on weekends. Malware rejects,
  # rate caps and relay policy above are untouched; skipped mail is marked
  # X-Spam-Skipped (and gets no X-Spam-Flag, so it stays in the inbox).
  # Default OFF (setting missing = always scan). One lookup per message,
  # stashed in acl_m so the two verb lines below don't re-query.
  warn set acl_m_nospam = ${if and{{match{$tod_full}{Sat|Sun}}{eq{${lookup mysql{SELECT value FROM settings WHERE name='spam_weekend_skip'}{$value}{0}}}{1}}}{yes}{no}}
  warn condition = ${if eq{$acl_m_nospam}{yes}}
       add_header = X-Spam-Skipped: weekend-policy
  # spamd scans as the dedicated debian-spamd user (real home for prefs +
  # Bayes) — never nobody (homeless: prefs/bayes writes fail into the void).
  warn condition = ${if !eq{$acl_m_nospam}{yes}}
       spam = debian-spamd/defer_ok
  warn condition = ${if !eq{$acl_m_nospam}{yes}}
       add_header = X-Spam-Score: $spam_score ($spam_bar)
  accept
begin authenticators
# SMTP AUTH via Dovecot SASL (matches the auth-client socket in dovecot.conf).
# Lets mailbox users send from MUAs (ports 25/587) with their mailbox password.
dovecot_plain:
  driver = dovecot
  public_name = PLAIN
  server_socket = /var/run/dovecot/auth-client
  server_set_id = $auth1
dovecot_login:
  driver = dovecot
  public_name = LOGIN
  server_socket = /var/run/dovecot/auth-client
  server_set_id = $auth1
# Relay client credentials (smarthost LOGIN): user/pass come from the relay
# map (root:Debian-exim 640 — never world-readable, never the panel DB).
# Missing values -> fail -> delivery defers with a clear error, never sends
# auth-less. Only exercised by the relay transports below.
relay_login:
  driver = plaintext
  public_name = LOGIN
  client_send = : ${lookup{user}lsearch{/etc/exim4/virtual/relay}{$value}fail} : ${lookup{pass}lsearch{/etc/exim4/virtual/relay}{$value}fail}
begin routers
# SMTP relay (panel Email page, admin only): when /etc/exim4/virtual/relay_on
# exists, ALL non-local outbound goes to the configured smarthost instead of
# direct MX. Two routers split by port convention (465 = implicit TLS, anything
# else STARTTLS) because a router's transport must be static. Absent flag or
# map file -> both decline -> direct delivery untouched. Secrets live in the
# relay map (root:Debian-exim 640); lookup RESULTS are trusted by the taint
# checker, never the envelope.
relay_tls:
  driver = manualroute
  condition = ${if and{{exists{/etc/exim4/virtual/relay_on}}{eq{${lookup{port}lsearch{/etc/exim4/virtual/relay}{$value}{}}}{465}}}{yes}{no}}
  transport = relay_smtps
  route_list = * ${lookup{host}lsearch{/etc/exim4/virtual/relay}{$value}fail}::465 byname
  # self = send (not the fail default): tests and multi-homed setups may point
  # the relay at a local address. A genuinely misconfigured relay-to-self
  # bounces bounded by received_header_max with clear logs — never silent.
  self = send
  no_more
relay_route:
  driver = manualroute
  condition = ${if and{{exists{/etc/exim4/virtual/relay_on}}{!eq{${lookup{port}lsearch{/etc/exim4/virtual/relay}{$value}{}}}{465}}}{yes}{no}}
  transport = relay_smtp
  route_list = * ${lookup{host}lsearch{/etc/exim4/virtual/relay}{$value}fail}::${lookup{port}lsearch{/etc/exim4/virtual/relay}{$value}{587}} byname
  self = send
  no_more
# Remote-handled domains (panel Domains page, mail_handling=remote): accepted
# here and routed by PUBLIC MX, before any local delivery. Mailboxes,
# forwarders, lists and autoresponders for these domains go dormant — their
# DB rows and map lines are kept, and toggle-back to local reactivates them
# with nothing to rebuild. The domain's MX MUST point at the provider (if it
# still points here Exim sees the loop and bounces — never silently drops).
remote_route:
  driver = dnslookup
  domains = +local_domains
  condition = ${lookup{$domain}lsearch{/etc/exim4/virtual/remote}{yes}{no}}
  transport = remote_smtp
  no_more
# KarnakPanel reports router (managed — do not hand-edit)
# DMARC/TLS-RPT aggregate intake (panel Email page, "Collect reports"):
# dmarc-reports@ / tls-reports@ of opted-in domains land in a spool maildir
# that the root ingest cron parses (mail-reports-ingest.sh). Sits before
# forwarders so a catch-all can never swallow reports. Path comes from the
# reports map lookup (taint-safe), never the envelope.
virtual_reports:
  driver = accept
  domains = +local_domains
  require_files = /etc/exim4/virtual/reports
  condition = ${lookup{$local_part@$domain}lsearch{/etc/exim4/virtual/reports}{yes}{no}}
  transport = reports_drop
# Forwarders first: explicit source->targets lines redirect before any local
# delivery. No line -> lookup fails -> router declines to virtual_mailbox.
# NOTE: a forwarder wins over a same-named mailbox (documented in the UI).
virtual_forward:
  driver = redirect
  domains = +local_domains
  data = ${lookup{$local_part@$domain}lsearch{/etc/exim4/virtual/forwarders}}
# Mailing lists (panel Email page): subscribers-only posting. Members match
# here and fan out; anything else claiming a list address falls through to
# the explicit reject below (a bounce, never silence).
virtual_list:
  driver = redirect
  domains = +local_domains
  condition = ${lookup{$local_part@$domain}lsearch{/etc/exim4/virtual/lists}{yes}{no}}
  condition = ${lookup{$sender_address}lsearch{${lookup{$local_part@$domain}lsearch{/etc/exim4/virtual/lists}{$value}fail}}{yes}{no}}
  data = ${lookup{$local_part@$domain}lsearch{/etc/exim4/virtual/listtargets}}
virtual_list_reject:
  driver = redirect
  domains = +local_domains
  condition = ${lookup{$local_part@$domain}lsearch{/etc/exim4/virtual/lists}{yes}{no}}
  data = :fail: only subscribers may post to this list
  allow_fail
# Vacation autoresponders (panel Email page): fires alongside delivery
# (unseen), one reply per sender per 7d via the once-DB. Sits AFTER forwarders
# (a forwarder wins, no reply) and BEFORE mailboxes. Paths come from the
# autoreplies map lookup (taint-safe); message files are written by
# autoreply-sync.sh as Debian-exim (writer of .once).
virtual_autoreply:
  driver = accept
  domains = +local_domains
  condition = ${lookup{$local_part@$domain}lsearch{/etc/exim4/virtual/autoreplies}{yes}{no}}
  transport = vacation_reply
  unseen
# Filtered mailboxes (panel Email filters): sieve-capable boxes route through
# Dovecot LMTP where their sieve script runs; everyone else keeps the direct
# appendfile path below, untouched.
virtual_lmtp_filter:
  driver = accept
  domains = +local_domains
  condition = ${lookup{$local_part@$domain}lsearch{/etc/exim4/virtual/filtered}{yes}{no}}
  transport = dovecot_lmtp
# Virtual mailboxes (panel DB is the existence check via the map files;# Dovecot does the real SQL lookup at IMAP/SMTP-AUTH time). Delivered as vmail.
# NOTE: envelope parts are tainted — paths MUST come from file-lookup results
# (maildirs), never from $domain/$local_part directly.
virtual_mailbox:
  driver = accept
  domains = +local_domains
  condition = ${lookup{$local_part@$domain}lsearch{/etc/exim4/virtual/maildirs}{yes}{no}}
  transport = virtual_delivery
# plus-addressing twin: info+tag@ delivers to info@ ($local_part is already
# stripped when local_part_suffix matches — same lookups as above)
virtual_mailbox_plus:
  driver = accept
  domains = +local_domains
  local_part_suffix = +*
  condition = ${lookup{$local_part@$domain}lsearch{/etc/exim4/virtual/maildirs}{yes}{no}}
  transport = virtual_delivery
# Catch-all: *@domain lines fire only for addresses that are NEITHER an exact
# forwarder NOR a mailbox (this router sits after both). Mailboxes always win.
virtual_catchall:
  driver = redirect
  domains = +local_domains
  data = ${lookup{*@$domain}lsearch{/etc/exim4/virtual/forwarders}}
# KarnakPanel role fallback (managed — do not hand-edit)
# postmaster@/abuse@ must reach someone (RFC 5321/2142): a hosted domain with
# no mailbox, forwarder or catch-all of its own for them gets them in its
# first-created mailbox. Creating postmaster@/abuse@ takes over (earlier
# routers win); a domain with no mailbox at all still refuses them.
virtual_role_fallback:
  driver = redirect
  domains = +local_domains
  local_parts = postmaster : abuse
  data = ${lookup mysql{SELECT CONCAT(e.localpart,'@',d.domain) FROM email_accounts e JOIN domains d ON d.id=e.domain_id WHERE d.domain='${quote_mysql:$domain}' ORDER BY e.id LIMIT 1}}
dnslookup:
  driver = dnslookup
  domains = ! +local_domains
  transport = remote_smtp
  no_more
localuser:
  driver = accept
  # box-local only (root, cron, unqualified): a hosted domain must never
  # reach a unix account's ~/Maildir (cross-tenant capture)
  domains = ! lsearch;/etc/exim4/virtual/domains : @ : localhost
  check_local_user
  transport = local_delivery
begin transports
# KarnakPanel reports transport (managed — do not hand-edit)
reports_drop:
  driver = appendfile
  directory = ${lookup{$local_part@$domain}lsearch{/etc/exim4/virtual/reports}{$value}fail}
  maildir_format
  quota = 100M
  create_directory
  envelope_to_add
  user = vmail
  group = vmail
  mode = 0600
  directory_mode = 0700
remote_smtp:
  driver = smtp
  # DKIM sign outbound when the sender domain is listed in the dkim map
  # (dkim-gen.sh maintains it). Miss -> empty expansion -> sent unsigned.
  # Map indirection (not $sender_address_domain straight into a path) keeps
  # Exim's taint checker happy: lookup RESULTS from files are trusted.
  dkim_domain = ${lookup{$sender_address_domain}lsearch{/etc/exim4/virtual/dkim}{$sender_address_domain}{}}
  dkim_selector = default
  dkim_private_key = ${lookup{$sender_address_domain}lsearch{/etc/exim4/virtual/dkim}{$value}{}}
# Relay transports (STARTTLS vs implicit-TLS twins; router picks by port).
# Auth via relay_login above; TLS required (never plaintext credentials).
# DKIM signing mirrors remote_smtp so relayed mail keeps its signatures.
relay_smtp:
  driver = smtp
  port = ${lookup{port}lsearch{/etc/exim4/virtual/relay}{$value}{587}}
  hosts_require_auth = *
  hosts_require_tls = *
  dkim_domain = ${lookup{$sender_address_domain}lsearch{/etc/exim4/virtual/dkim}{$sender_address_domain}{}}
  dkim_selector = default
  dkim_private_key = ${lookup{$sender_address_domain}lsearch{/etc/exim4/virtual/dkim}{$value}{}}
relay_smtps:
  driver = smtp
  protocol = smtps
  port = 465
  hosts_require_auth = *
  dkim_domain = ${lookup{$sender_address_domain}lsearch{/etc/exim4/virtual/dkim}{$sender_address_domain}{}}
  dkim_selector = default
  dkim_private_key = ${lookup{$sender_address_domain}lsearch{/etc/exim4/virtual/dkim}{$value}{}}
# LMTP handoff for sieve-filtered mail (see virtual_lmtp_filter router).
# Dovecot delivers as vmail (userdb) and runs the box's sieve script.
dovecot_lmtp:
  driver = lmtp
  socket = /var/run/dovecot/lmtp
  batch_max = 20
vacation_reply:
  driver = autoreply
  to = $sender_address
  from = $local_part@$domain
  subject = ${readfile{${lookup{$local_part@$domain}lsearch{/etc/exim4/virtual/autoreplies}{$value}fail}.subj}}
  text = ${readfile{${lookup{$local_part@$domain}lsearch{/etc/exim4/virtual/autoreplies}{$value}fail}.msg}}
  once = ${lookup{$local_part@$domain}lsearch{/etc/exim4/virtual/autoreplies}{$value}fail}.once
  once_repeat = 7d
virtual_delivery:
  driver = appendfile
  directory = ${lookup{$local_part@$domain}lsearch{/etc/exim4/virtual/maildirs}{$value}fail}
  maildir_format
  maildir_use_size_file
  # per-mailbox spam flag: X-Spam-Flag when the spamd score beats the box's
  # own threshold (default 5.0). Empty expansion adds no header; weekend-
  # skipped mail (acl_m_nospam, no scan ran) is excluded explicitly so a
  # missing score can never compare true. Same taint-safe lookup shape as
  # the quota line above.
  headers_add = ${if and{{!eq{$acl_m_nospam}{yes}}{>{$spam_score_int}{${lookup mysql{SELECT e.spam_threshold FROM email_accounts e JOIN domains d ON d.id=e.domain_id WHERE e.localpart='${quote_mysql:$local_part}' AND d.domain='${quote_mysql:$domain}'}{$value}{5.0}}}}}{X-Spam-Flag: YES}}
  # SMTP-time quota enforcement from the panel DB (taint-safe via quote_mysql).
  # Lookup failure defers (safe); over-quota bounces with "quota exceeded".
  quota = ${lookup mysql{SELECT quota_mb FROM email_accounts e JOIN domains d ON d.id=e.domain_id WHERE e.localpart='${quote_mysql:$local_part}' AND d.domain='${quote_mysql:$domain}'}{${value}M}{fail}}
  create_directory
  delivery_date_add
  envelope_to_add
  return_path_add
  user = vmail
  group = vmail
  mode = 0600
  directory_mode = 0700
local_delivery:
  driver = appendfile
  directory = $home/Maildir
  maildir_format
  delivery_date_add
  envelope_to_add
  return_path_add
